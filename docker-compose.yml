services:
  mongodb:
    image: mongo:7
    container_name: smart-leads-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: smart-leads-backend
    restart: unless-stopped
    environment:
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/smart-leads-dashboard
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-secure-secret}
    ports:
      - "5001:5001"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001/api}
    container_name: smart-leads-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:
